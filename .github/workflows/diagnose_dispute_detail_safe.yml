name: Diagnose Detail Sanggahan (Aman)
on:
  workflow_dispatch:
    inputs:
      detail_id:
        description: "ID numerik dari URL terkonfirmasi_detail.php (bukan nomor SIM)"
        type: string
        required: true
        default: "80971"

permissions:
  contents: read

jobs:
  read-only-probe:
    name: Periksa struktur detail tanpa data pribadi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate probe and syntax (offline)
        run: |
          python -m py_compile diagnose_dispute_detail_safe.py
          python -m unittest -q test_dispute_detail_safe.py
      - name: Install browser for read-only probe
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Read-only ETLE detail structure
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          DETAIL_ID: ${{ inputs.detail_id }}
        run: python diagnose_dispute_detail_safe.py
# No Supabase secrets, document downloads, HTML dumps, screenshots, artifacts,
# push notifications, or modifications to ETLE/Supabase records.
