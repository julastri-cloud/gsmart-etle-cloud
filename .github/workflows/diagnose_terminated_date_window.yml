name: Diagnose ETLE Dihentikan Date Window (Read Only)
on:
  push:
    branches: [main]
    paths:
      - diagnose_terminated_date_window.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-date-window:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile diagnose_terminated_date_window.py
      - name: Install temporary authenticated ETLE browser
        run: |
          python -m pip install --disable-pip-version-check playwright requests
          python -m playwright install --with-deps chromium
      - name: Probe date ranges read-only, output counts only
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          TARGET_TNKB: AG9741VJ
        run: python diagnose_terminated_date_window.py
