name: Test G-SMART ETLE V2

on:
  workflow_dispatch:

jobs:
  test-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv
          python -m playwright install --with-deps chromium

      - name: Run G-SMART ETLE V2 test
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          DATE_FROM: "01-08-2026"

          SYNC_LIMIT: "0"
          HEADLESS: "true"
          REQUEST_DELAY: "0.5"
          MAX_RETRY: "3"
          PRINTED_PAGE_SIZE: "100"

        run: python sync_etle_v2.py
