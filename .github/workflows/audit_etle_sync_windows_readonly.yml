name: Audit ETLE Source Coverage (Read Only)
on:
  push:
    branches: [main]
    paths: [audit_etle_sync_windows_readonly.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-five-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax test
        run: python -m py_compile audit_etle_sync_windows_readonly.py
      - name: Install ETLE read-only audit runtime
        run: |
          python -m pip install --disable-pip-version-check playwright supabase python-dotenv requests firebase-admin
          python -m playwright install --with-deps chromium
      - name: Compare API scopes without writing any data
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: full
          DATE_FROM: '01-08-2026'
          TEST_LIMIT: '0'
          HEADLESS: 'true'
          PRINTED_PAGE_SIZE: '100'
        run: python audit_etle_sync_windows_readonly.py
