name: Validate Private Dispute Evidence Security
on:
  pull_request:
    paths:
      - 'supabase/functions/gsmart-dispute-private/**'
      - 'supabase/migrations/20261010_gsmart_dispute_evidence_private.sql'
      - 'test_dispute_private_security.mjs'
      - '.github/workflows/validate_dispute_private_security.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Admin-only role and file path isolation
        run: node --test test_dispute_private_security.mjs
