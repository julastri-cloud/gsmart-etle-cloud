name: Telegram CAPTCHA helper tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-captcha-human-in-loop
    paths:
      - "telegram_captcha.py"
      - "sync_etle.py"
      - "sync_private_dispute_one.py"
      - "diagnose_dispute_detail_safe.py"
      - "diagnose_terminated_vehicle_photo_safe.py"
      - "sync_stopped_vehicle_photos.py"
      - "sync_etle_v2.py"
      - "sync_single_blue.py"
      - "sync_single_printed_photo.py"
      - "diagnose_printed_photo.py"
      - "extract_dispute_detail_readonly.py"
      - "tests/test_telegram_captcha.py"
      - ".github/workflows/test-telegram-captcha.yml"
      - ".github/workflows/import_private_dispute_one.yml"
      - ".github/workflows/private_disputes_bootstrap.yml"
      - ".github/workflows/stopped_vehicle_photo_bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "telegram_captcha.py"
      - "tests/test_telegram_captcha.py"
      - ".github/workflows/test-telegram-captcha.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Check edited Python syntax
        run: python -m py_compile telegram_captcha.py sync_etle.py sync_etle_v2.py sync_single_blue.py sync_single_printed_photo.py diagnose_printed_photo.py extract_dispute_detail_readonly.py sync_private_dispute_one.py diagnose_dispute_detail_safe.py diagnose_terminated_vehicle_photo_safe.py sync_stopped_vehicle_photos.py
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
