name: G-SMART ETLE to Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv requests firebase-admin
          python -m playwright install --with-deps chromium

      # ======================================================
      # 4. RUN ETLE SYNC
      # ======================================================
      - name: Run ETLE sync
        env:

          # --------------------------------------------------
          # ETLE HUB
          # --------------------------------------------------
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}

          # --------------------------------------------------
          # SUPABASE
          # --------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # --------------------------------------------------
          # WHATSAPP FONNTE
          # --------------------------------------------------
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}

          # --------------------------------------------------
          # FIREBASE CLOUD MESSAGING
          # --------------------------------------------------
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # --------------------------------------------------
          # SYNC CONFIGURATION
          # --------------------------------------------------
          SYNC_MODE: 'incremental'
          LOOKBACK_DAYS: '14'
          TEST_LIMIT: '0'

          # --------------------------------------------------
          # PLAYWRIGHT / REQUEST
          # --------------------------------------------------
          HEADLESS: 'true'
          REQUEST_DELAY: '0.5'
          MAX_RETRY: '3'
          PRINTED_PAGE_SIZE: '100'
          SYNC_SHIPPING_DETAILS: 'true'

        run: |
          python sync_etle.py

  # Runs only after the ETLE incremental sync job succeeds.
  # Does not change the source sync, Android FCM, or WhatsApp handling.
  notify-web-pwa:
    name: Kirim Push G-Smart PWA setelah sinkronisasi
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout latest G-Smart Web Push sender
        uses: actions/checkout@v4
        with:
          repository: uppkb-guyangan/uppkb-guyangan.github.io
          ref: main
          path: gsmart-web-push
          sparse-checkout: |
            scripts
            gsmart-push-sw

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kirim push PWA untuk perubahan ETLE baru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_MODE: run
        run: node gsmart-web-push/scripts/push-production.mjs

  # Private evidence is a SEPARATE dependent job. It never alters ETLE records,
  # WA/FCM notifications, normal vehicle photos, or existing sync counters.
  sync-private-disputes:
    name: Sinkronisasi privat SIM dan bukti sanggahan (aktif + dihentikan)
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: gsmart-etle-private-evidence
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright requests
          python -m playwright install --with-deps chromium
      - name: Sync missing and changed dispute evidence (private only)
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTO_PRIVATE_MAX_CASES: '12'
          AUTO_PRIVATE_MISSING_RECHECK_HOURS: '24'
          AUTO_PRIVATE_FULL_RECHECK_HOURS: '168'
        run: python sync_private_disputes_auto.py

  # Best-effort original ETLE vehicle photos for STOPPED cases, independent
  # from the main ETLE/shipping/WA/FCM jobs and dispute SIM documents.
  sync-stopped-vehicle-photos:
    name: Arsip foto kendaraan perkara Dihentikan
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gsmart-stopped-vehicle-photos
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated ETLE browser
        run: |
          python -m pip install --disable-pip-version-check playwright requests
          python -m playwright install --with-deps chromium
      - name: Import protected stopped-case vehicle photos
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STOPPED_PHOTO_MAX_CASES: '12'
        run: python sync_stopped_vehicle_photos.py
