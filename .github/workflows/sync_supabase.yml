name: G-SMART ETLE to Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv requests firebase-admin
          python -m playwright install --with-deps chromium

      # ======================================================
      # 4. SHIPPING DETAIL FIX
      # Samakan perilaku incremental dengan Full Weekly yang
      # sudah terbukti berhasil mengambil foto + data BLUE.
      # ======================================================
      - name: Apply shipping detail wait fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sync_etle.py')
          text = path.read_text(encoding='utf-8')
          old = '''    page.goto(detail_url, wait_until="domcontentloaded", timeout=60000)\n    try:\n        page.evaluate("window.stop()")\n    except Exception:\n        pass\n    page.wait_for_timeout(150)\n'''
          new = '''    page.goto(detail_url, wait_until="domcontentloaded", timeout=60000)\n    try:\n        page.wait_for_load_state("networkidle", timeout=30000)\n    except Exception:\n        pass\n    # printed_detail mengisi informasi kendaraan setelah DOM awal selesai.\n    # Tunggu agar foto ETLE dan data BLUE benar-benar tersedia sebelum dibaca.\n    page.wait_for_timeout(1000)\n'''
          if old not in text:
              raise SystemExit('Target shipping detail block tidak ditemukan; patch dibatalkan agar aman.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Shipping detail wait fix applied.')
          PY

      # ======================================================
      # 5. RUN ETLE SYNC
      # ======================================================
      - name: Run ETLE sync
        env:

          # --------------------------------------------------
          # ETLE HUB
          # --------------------------------------------------
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}

          # --------------------------------------------------
          # SUPABASE
          # --------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # --------------------------------------------------
          # WHATSAPP FONNTE
          # --------------------------------------------------
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}

          # --------------------------------------------------
          # FIREBASE CLOUD MESSAGING
          # --------------------------------------------------
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # --------------------------------------------------
          # SYNC CONFIGURATION
          # --------------------------------------------------
          SYNC_MODE: 'incremental'
          LOOKBACK_DAYS: '14'
          TEST_LIMIT: '0'

          # --------------------------------------------------
          # PLAYWRIGHT / REQUEST
          # --------------------------------------------------
          HEADLESS: 'true'
          REQUEST_DELAY: '0.5'
          MAX_RETRY: '3'
          PRINTED_PAGE_SIZE: '100'
          SYNC_SHIPPING_DETAILS: 'true'

        run: |
          python sync_etle.py
