name: Validate Stopped Vehicle Photo Diagnostic
on:
  pull_request:
    paths:
      - 'diagnose_terminated_vehicle_photo_safe.py'
      - 'test_terminated_vehicle_photo_safe.py'
      - '.github/workflows/diagnose_terminated_vehicle_photo_safe.yml'
      - '.github/workflows/test_terminated_vehicle_photo_safe.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test structural diagnostic without ETLE login
        run: python -m unittest -q test_terminated_vehicle_photo_safe.py
