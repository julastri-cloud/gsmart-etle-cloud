name: Dry Run Ekstraksi Sanggahan (Aman)
on:
  workflow_dispatch:
    inputs:
      detail_id:
        description: "ID numerik dari URL detail sanggahan (bukan nomor SIM)"
        type: string
        required: true
        default: "80971"
permissions:
  contents: read
jobs:
  extract-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tes offline dan syntax
        run: |
          python -m py_compile diagnose_dispute_detail_safe.py extract_dispute_detail_readonly.py
          python -m unittest -q test_dispute_detail_extraction_readonly.py
      - name: Pasang Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Periksa ekstraksi in-memory (hanya laporan nonpribadi)
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          DETAIL_ID: ${{ inputs.detail_id }}
        run: python extract_dispute_detail_readonly.py
# Tidak memakai secret Supabase, tidak menulis database, tidak menyimpan
# screenshot, HTML, URL/media pribadi, artifact, atau mengirim notifikasi.
