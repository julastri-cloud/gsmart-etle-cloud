name: Diagnose Foto Kendaraan Dihentikan (Aman)
on:
  push:
    branches: [main]
    paths:
      - 'diagnose_terminated_vehicle_photo_safe.py'
  workflow_dispatch:
    inputs:
      violation_id:
        type: string
        required: true
        default: '37359'
permissions:
  contents: read
jobs:
  inspect-stopped-vehicle-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and safety tests
        run: python -m unittest -q test_terminated_vehicle_photo_safe.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Read-only structure probe without case content
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          VIOLATION_ID: ${{ inputs.violation_id || '37359' }}
        run: python diagnose_terminated_vehicle_photo_safe.py
