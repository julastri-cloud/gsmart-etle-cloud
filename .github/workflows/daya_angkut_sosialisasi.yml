name: G-SMART Konfirmasi Daya Angkut Sosialisasi

on:
  schedule:
    - cron: "30 0,10 * * *" # 07.30 & 17.30 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = hanya cek, false = terapkan hasil"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

jobs:
  daya-angkut-sosialisasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv requests firebase-admin
          python -m playwright install --with-deps chromium

      - name: Check Konfirmasi Daya Angkut Sosialisasi
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          SYNC_MODE: "full"
          DATE_FROM: "01-08-2026"
          TEST_LIMIT: "0"
          HEADLESS: "true"
          REQUEST_DELAY: "0.5"
          MAX_RETRY: "3"
          PRINTED_PAGE_SIZE: "100"
          CONFIRMATION_MISSING_THRESHOLD: "2"

          DRY_RUN: ${{ inputs.dry_run }}

        run: |
          python daya_angkut_sosialisasi.py

      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daya-angkut-sosialisasi-result
          path: daya_angkut_sosialisasi_result.json
          if-no-files-found: warn
          retention-days: 3
